<!--
  TheBoostDeck reusable skin manager.
  Copy this modal block into the skin's index.html before </body>, include
  skin-manager.css and skin-manager.js, and mount the component from a visible
  trigger button. See SKILL.md for the copy-and-mount steps.
-->
<div class="tbd-sm-overlay" data-tbd-skin-manager hidden>
  <section class="tbd-sm-dialog" id="tbd-sm-dialog" role="dialog" aria-modal="true" aria-labelledby="tbd-sm-title">
    <header class="tbd-sm-header">
      <div class="tbd-sm-heading">
        <div class="tbd-sm-kicker" data-tbd-label="kicker">UI 皮肤</div>
        <h2 class="tbd-sm-title" id="tbd-sm-title" data-tbd-label="title">皮肤管理</h2>
        <p class="tbd-sm-subtitle" data-tbd-label="subtitle">选择皮肤，或导入/导出 .boostskin 文件。</p>
      </div>
      <button class="tbd-sm-icon-button tbd-sm-close" type="button" data-tbd-close data-tbd-aria-label="close" aria-label="关闭皮肤管理">
        <svg class="tbd-sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="tbd-sm-grid" data-tbd-grid aria-live="polite">
      <div class="tbd-sm-empty" data-tbd-label="loading">正在读取皮肤列表…</div>
    </div>

    <footer class="tbd-sm-footer">
      <div class="tbd-sm-status" data-tbd-status aria-live="polite"></div>
      <button class="tbd-sm-action" type="button" data-tbd-export-skill data-tbd-title="exportSkillHint">
        <svg class="tbd-sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.1 5.2L19 10l-4.9 1.8L12 17l-2.1-5.2L5 10l4.9-1.8zM19 15l1 2.4L22.5 18l-2.5.9L19 21l-1-2.1L15.5 18l2.5-.6z"/></svg>
        <span data-tbd-label="exportSkill">导出 Skill</span>
      </button>
      <button class="tbd-sm-action" type="button" data-tbd-export-current disabled data-tbd-title="exportDisabled">
        <svg class="tbd-sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        <span data-tbd-label="exportCurrent">导出当前皮肤</span>
      </button>
      <button class="tbd-sm-action tbd-sm-primary" type="button" data-tbd-import>
        <svg class="tbd-sm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>
        <span data-tbd-label="import">导入皮肤</span>
      </button>
    </footer>
  </section>
</div>
