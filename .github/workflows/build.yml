name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\TheBoostDeck.sln

      - name: Build
        run: dotnet build .\TheBoostDeck.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\tests\TheBoostDeck.Tests\TheBoostDeck.Tests.csproj --configuration Release --no-build
